[project]
name = "tadg"
version = "0.1.0"
description = "Dual Q and world-model gradients with an integrated SuperMimic baseline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["supermimic", "numpy"]

[project.optional-dependencies]
train = [
  "mjlab", "torch>=2.14.0", "warp-lang>=1.15.0", "mujoco-warp~=3.16.0",
  "mujoco~=3.16.0", "tensorboard>=2.20.0", "tyro>=1.0.1",
  "huggingface-hub>=0.30", "pyarrow",
]
retarget = [
  "modelscope-hub>=0.1.8", "mujoco==3.17.0", "mink==1.1.1", "daqp==0.8.7",
  "torch==2.6.0", "PyYAML>=6.0", "glfw>=2.7", "imageio>=2.34",
  "imageio-ffmpeg>=0.5", "pillow>=10",
]

[project.scripts]
tadg-train = "tadg.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "pyright>=1.1.400"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tadg"]

[tool.uv]
cache-dir = ".uv-cache"
conflicts = [[{ extra = "train" }, { extra = "retarget" }]]

[tool.uv.workspace]
members = ["baselines/supermimic"]

[tool.uv.sources]
supermimic = { workspace = true }
mjlab = { git = "https://github.com/mujocolab/mjlab", rev = "8bb2bc9e187797689ec82c78c35019afd2fd0376" }
torch = [
  { index = "pytorch-cu130", extra = "train", marker = "sys_platform != 'darwin'" },
  { index = "pytorch-cpu", extra = "retarget" },
]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }

[[tool.uv.index]]
url = "https://repo.huaweicloud.com/repository/pypi/simple"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
